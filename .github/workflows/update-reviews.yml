name: Weekly Airbnb Reviews Scraper

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual triggering from GitHub actions UI

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper Script
        run: node scripts/scrape_reviews.js

      - name: Process New Reviews
        run: node scripts/process_reviews.js

      - name: Check for changes
        id: git-status
        run: |
          if [[ -n $(git status --porcelain src/data/reviews.json) ]]; then
            echo "changes_exist=true" >> $GITHUB_ENV
          else
            echo "changes_exist=false" >> $GITHUB_ENV
          fi

      - name: Commit and push changes
        if: env.changes_exist == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/airbnb_reviews_dom.json src/data/reviews.json
          git commit -m "chore: automated weekly update of guest reviews"
          git push
